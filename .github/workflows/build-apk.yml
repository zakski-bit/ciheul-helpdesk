name: Helpdesk Omnichannel CI/CD

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Pytest Suite
        run: pytest backend/tests/test_api.py -v

  flutter-tests:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile-flutter
        run: flutter pub get

      - name: Run Flutter Analyzer
        working-directory: mobile-flutter
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: mobile-flutter
        run: flutter test

  # CI Build Job: runs on pull requests and pushes without production secrets.
  # Uses isolated ephemeral keystore for build integrity verification.
  build-ci-apk:
    name: Build CI Verification APK
    needs: [backend-tests, flutter-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        working-directory: mobile-flutter
        run: flutter pub get

      - name: Configure CI Keystore
        working-directory: mobile-flutter/android
        run: |
          if [ ! -f "key.properties" ]; then
            keytool -genkeypair -v -keystore ciheul-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias ciheul_ci_key -dname "CN=Ciheul Helpdesk CI, OU=Engineering, O=Ciheul Technologies, C=ID" -storepass ciheul_keystore_pass123 -keypass ciheul_keystore_pass123
            echo "keyAlias=ciheul_ci_key" > key.properties
            echo "keyPassword=ciheul_keystore_pass123" >> key.properties
            echo "storeFile=ciheul-release.jks" >> key.properties
            echo "storePassword=ciheul_keystore_pass123" >> key.properties
            cp key.properties app/key.properties || true
            cp ciheul-release.jks app/ciheul-release.jks || true
          fi

      - name: Build CI APK
        working-directory: mobile-flutter
        env:
          STRICT_RELEASE: "false"
        run: flutter build apk --release

      - name: Cleanup CI Keystore Files
        if: always()
        run: |
          rm -f mobile-flutter/android/ciheul-release.jks mobile-flutter/android/key.properties mobile-flutter/android/app/ciheul-release.jks mobile-flutter/android/app/key.properties

      - name: Upload CI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ciheul-helpdesk-ci-apk
          path: mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

  # Production Release Job:
  # Runs ONLY on explicit version tags (v*), never on pull requests or branch pushes.
  # Production signing secrets are strictly isolated to this job's signing step.
  release-official-apk:
    name: Publish Official Production Release
    needs: [backend-tests, flutter-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        working-directory: mobile-flutter
        run: flutter pub get

      - name: Configure Production Release Keystore
        working-directory: mobile-flutter/android
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "FATAL: RELEASE_KEYSTORE_BASE64 secret is not configured in repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > ciheul-release.jks
          echo "keyAlias=${KEY_ALIAS:-ciheul_release_key}" > key.properties
          echo "keyPassword=${KEY_PASSWORD}" >> key.properties
          echo "storeFile=ciheul-release.jks" >> key.properties
          echo "storePassword=${STORE_PASSWORD}" >> key.properties
          cp key.properties app/key.properties || true
          cp ciheul-release.jks app/ciheul-release.jks || true

      - name: Build Official Release APK
        working-directory: mobile-flutter
        run: flutter build apk --release

      - name: Cleanup Keystore Files
        if: always()
        run: |
          rm -f mobile-flutter/android/ciheul-release.jks mobile-flutter/android/key.properties mobile-flutter/android/app/ciheul-release.jks mobile-flutter/android/app/key.properties

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
