name: Helpdesk Omnichannel CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Pytest Suite
        run: pytest backend/tests/test_api.py -v

  flutter-tests:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile-flutter
        run: flutter pub get

      - name: Run Flutter Analyzer
        working-directory: mobile-flutter
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: mobile-flutter
        run: flutter test

  build-apk:
    name: Build Android Release APK
    needs: [backend-tests, flutter-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        working-directory: mobile-flutter
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile-flutter
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ciheul-helpdesk-release-apk
          path: mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
