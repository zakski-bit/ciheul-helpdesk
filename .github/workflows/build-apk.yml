name: Helpdesk Omnichannel CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Pytest Suite
        run: pytest backend/tests/test_api.py -v

  flutter-tests:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: mobile-flutter
        run: flutter pub get

      - name: Run Flutter Analyzer
        working-directory: mobile-flutter
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: mobile-flutter
        run: flutter test

  build-apk:
    name: Build Android Release APK
    needs: [backend-tests, flutter-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        working-directory: mobile-flutter
        run: flutter pub get

      - name: Configure Production Release Keystore
        working-directory: mobile-flutter/android
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > ciheul-release.jks
            echo "keyAlias=${KEY_ALIAS:-ciheul_release_key}" > key.properties
            echo "keyPassword=${KEY_PASSWORD:-ciheul_keystore_pass123}" >> key.properties
            echo "storeFile=ciheul-release.jks" >> key.properties
            echo "storePassword=${STORE_PASSWORD:-ciheul_keystore_pass123}" >> key.properties
          elif [ ! -f "key.properties" ]; then
            keytool -genkeypair -v -keystore ciheul-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias ciheul_release_key -dname "CN=Ciheul Helpdesk, OU=Engineering, O=Ciheul Technologies, C=ID" -storepass ciheul_keystore_pass123 -keypass ciheul_keystore_pass123
            echo "keyAlias=ciheul_release_key" > key.properties
            echo "keyPassword=ciheul_keystore_pass123" >> key.properties
            echo "storeFile=ciheul-release.jks" >> key.properties
            echo "storePassword=ciheul_keystore_pass123" >> key.properties
          fi

      - name: Build Release APK
        working-directory: mobile-flutter
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ciheul-helpdesk-release-apk
          path: mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Skip Official Release Notice
        if: secrets.RELEASE_KEYSTORE_BASE64 == ''
        run: |
          echo "INFO: RELEASE_KEYSTORE_BASE64 secret is not set. APK artifact compiled successfully for CI verification (available in Artifacts), but GitHub Release publishing was skipped to protect production release signature integrity."

      - name: Create or Update GitHub Release with APK
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && secrets.RELEASE_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.ref_name }}
          name: Ciheul Helpdesk Release ${{ github.ref_name }}
          files: mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
